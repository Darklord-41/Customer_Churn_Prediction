  id: 'refline',
  afterDatasetsDraw(chart, _a, o) {

      ctx.save(); ctx.strokeStyle = css('--ink2'); ctx.lineWidth = 1.25; ctx.setLineDash([5, 4]);
      ctx.beginPath();

      ctx.stroke(); ctx.setLineDash([]);

        ctx.fillStyle = css('--ink2'); ctx.font = '11px ' + FAM;
        if (l.axis === 'y') { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(l.label, a.right - 2, px - 3); }

/* generic sortable / paged table */
function mkTable(host, { cols, getRows, perPage = 0, scroll = false }) {
  const st = { k: null, dir: 1, page: 0 };
  function render(resetPage) {
    if (resetPage) st.page = 0;
    let rows = getRows().slice();
    if (st.k) {
      const c = cols.find(c => c.k === st.k);
      rows.sort((a, b) => { const x = c.v ? c.v(a) : a[st.k], y = c.v ? c.v(b) : b[st.k]; return (x > y ? 1 : x < y ? -1 : 0) * st.dir; });
    }
    const total = rows.length, pages = Math.max(1, Math.ceil(total / (perPage || 1)));
    if (perPage) { st.page = Math.min(st.page, pages - 1); rows = rows.slice(st.page * perPage, (st.page + 1) * perPage); }
    host.innerHTML = `<div class="tw ${scroll ? 'scroll' : ''}"><table class="tbl"><thead><tr>${cols.map(c =>
      `<th class="${c.num ? 'num' : ''}" aria-sort="${st.k === c.k ? (st.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" data-k="${c.k}">${c.label}${st.k === c.k ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`).join('')}</tr></thead>
      <tbody>${rows.length ? rows.map(r => `<tr>${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" style="color:var(--ink3)">No rows match the current filters.</td></tr>`}</tbody></table></div>
      ${perPage ? `<div class="pager"><span>${total ? st.page * perPage + 1 : 0}–${Math.min(total, (st.page + 1) * perPage)} of ${nf0.format(total)}</span><button type="button" class="btn" data-p="-1" ${st.page === 0 ? 'disabled' : ''}>Prev</button><button type="button" class="btn" data-p="1" ${st.page >= pages - 1 ? 'disabled' : ''}>Next</button></div>` : ''}`;
    $$('th button', host).forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; if (st.k === k) st.dir *= -1; else { st.k = k; st.dir = 1; } render(); }));
    $$('.pager .btn', host).forEach(b => b.addEventListener('click', () => { st.page += +b.dataset.p; render(); }));
  }
  return { render };
}

      `Churn moves by only <b>${((cs[0].p - cs[cs.length - 1].p) * 100).toFixed(1)} pts</b> across contract types (${cs[0].key} ${pct(cs[0].p)}, ${cs[cs.length - 1].key} ${pct(cs[cs.length - 1].p)}). Other fields look equally flat in the Churn Explorer.`,
      `On the hold-out set all four models score ROC-AUC <b>${Math.min(...tAuc).toFixed(2)}–${Math.max(...tAuc).toFixed(2)}</b>, no better than chance. The available fields hold little signal about who leaves.`,
      `<b>${chn[0].k}</b> returns the most per dollar (${chn[0].roas.toFixed(1)}×); <b>${chn[chn.length - 1].k}</b> returns the least (${chn[chn.length - 1].roas.toFixed(1)}×). ${met} of ${MK.length} campaigns beat their revenue target.`,
      `Average monthly sales grew from <b>${usdk(yr[0])}</b> in ${SL_YEARS[0]} to <b>${usdk(yr[yr.length - 1])}</b> in ${SL_YEARS[SL_YEARS.length - 1]}, about <b>${(cagr * 100).toFixed(0)}%</b> a year.`

/* ================= CHURN EXPLORER ================= */
V.churn = (() => {
  let built = false, pane, tbl;
  function buildSlicers() {
    const host = $('.slicers', pane); host.innerHTML = '';
    CH_SLICERS.forEach(k => slicer(host, LBL[k], optionsOf(k), S.churn.sel[k], render));
    rangeSlicer(host, 'ch-ten-r', 'Tenure (months)', 1, 72, 1, S.churn.tenure, v => v, render);
    rangeSlicer(host, 'ch-mon-r', 'Monthly charges', 20, 120, 1, S.churn.monthly, v => '$' + v, render);
  }
  function build() {
    pane = $('#pane-churn');
    pane.innerHTML = `<div class="layout">${sideShell('Customer filters')}<section class="main">
      <div class="callout" id="ch-insight"></div>
      <div class="kpis" id="ch-kpis"></div>
      <div class="grid g2">
        ${card('Churn rate by segment', 'Bars start at 0%. The dashed line is the rate for the current selection.', '<div class="cbox" id="ch-seg-box"><canvas id="ch-seg"></canvas></div>', selectBox('ch-dim', 'Segment by', DIM_OPTS, S.churn.dim))}
        ${card('Churn rate by tenure', 'Shaded band is the 95% confidence interval of each 6-month group. Dashed line is the selection average.', '<div class="cbox"><canvas id="ch-ten"></canvas></div>')}
      </div>
      <div class="grid g2">
        ${card('Churn rate by monthly charge', 'Billing bands of $20. Dashed line is the selection average.', '<div class="cbox short"><canvas id="ch-chg"></canvas></div>')}
        ${card('Churn rate by add-on services', 'Count of security, backup, protection, tech support and streaming add-ons. Dashed line is the selection average.', '<div class="cbox short"><canvas id="ch-svc"></canvas></div>')}
      </div>
      ${card('Segment cross-tab', 'Churn rate for customers in both segments. Blue is below the selection average, red above. Cells with fewer than 30 customers are faded.',
        '<div class="tw"><div id="ch-heat" style="padding:6px"></div></div><div class="legendbar"><span>−10 pts</span><i></i><span>+10 pts</span></div>',
        `<div style="display:flex;gap:12px;flex-wrap:wrap">${selectBox('ch-hx', 'Rows', CAT_OPTS, S.churn.hx)}${selectBox('ch-hy', 'Columns', CAT_OPTS, S.churn.hy)}</div>`)}
      ${card('Customer list', 'Rows in the current selection. Click a column heading to sort.', '<div id="ch-tbl"></div>', '<input type="search" id="ch-q" placeholder="Search customer ID" aria-label="Search customer ID">')}
    </section></div>`;
    wireSide(pane); buildSlicers();
    $('.reset', pane).addEventListener('click', () => {
      CH_SLICERS.forEach(k => S.churn.sel[k].clear());
      S.churn.tenure[0] = 1; S.churn.tenure[1] = 72; S.churn.monthly[0] = 20; S.churn.monthly[1] = 120;
      buildSlicers(); render();
    });
    $('#ch-dim').addEventListener('change', e => { S.churn.dim = e.target.value; render(); });
    $('#ch-hx').addEventListener('change', e => { S.churn.hx = e.target.value; render(); });
    $('#ch-hy').addEventListener('change', e => { S.churn.hy = e.target.value; render(); });
    $('#ch-q').addEventListener('input', e => { S.churn.q = e.target.value.trim().toLowerCase(); tbl.render(true); });
    tbl = mkTable($('#ch-tbl'), {
      perPage: 10,
      getRows: () => filterChurn().filter(r => !S.churn.q || r.id.toLowerCase().includes(S.churn.q)),
      cols: [
        { k: 'id', label: 'Customer' }, { k: 'Contract', label: 'Contract' }, { k: 'InternetService', label: 'Internet' },
        { k: 'tenure', label: 'Tenure (mo)', num: true }, { k: 'monthly', label: 'Monthly', num: true, f: r => usd2(r.monthly) },
        { k: 'total', label: 'Total billed', num: true, f: r => usd(r.total) }, { k: 'nsvc', label: 'Add-ons', num: true, v: r => +r.nsvc },
        { k: 'churn', label: 'Status', f: r => `<span class="pill ${r.churn ? 'bad' : 'good'}">${r.churn ? '✕ Churned' : '✓ Retained'}</span>` }
      ]
    });
  }
  function insight(rows, base) {
    if (rows.length < 100) return `<span class="tag">Small selection</span>Only ${rows.length} customers match. Rates below are unstable, so widen the filters before drawing conclusions.`;
    let best = null;
    DIM_KEYS.forEach(d => {
      groupBy(rows, r => r[d]).forEach((g, k) => {
        if (g.length < 50) return;
        const p = g.reduce((s, r) => s + r.churn, 0) / g.length, se = Math.sqrt(base * (1 - base) / g.length) || 1e-9, z = (p - base) / se;
        if (!best || Math.abs(z) > Math.abs(best.z)) best = { d, k, p, z, n: g.length };
      });
    });
    if (!best) return '';
    if (Math.abs(best.z) < 3) return `<span class="tag">Reading the data</span>No segment differs from this selection's churn rate (<b>${pct(base)}</b>) by more than sampling noise. The largest gap is <b>${LBL[best.d]} = ${best.k}</b> at ${pts(best.p - base)} (n=${nf0.format(best.n)}). Treat the rankings below as exploratory.`;
    return `<span class="tag">Stands out</span><b>${LBL[best.d]} = ${best.k}</b> churns at ${pct(best.p)} against ${pct(base)} for the selection (${pts(best.p - base)}, z=${best.z.toFixed(1)}, n=${nf0.format(best.n)}).`;
  }
  function heat(rows, base) {
    const hx = S.churn.hx, hy = S.churn.hy;
    const rk = optionsOf(hx).filter(v => rows.some(r => r[hx] === v)), ck = optionsOf(hy).filter(v => rows.some(r => r[hy] === v));
    const m = groupBy(rows, r => r[hx] + '\u0001' + r[hy]);
    $('#ch-heat').innerHTML = `<table class="heat"><thead><tr><th></th>${ck.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rk.map(r =>
      `<tr><th class="rh">${esc(r)}</th>${ck.map(c => {
        const g = m.get(r + '\u0001' + c); if (!g) return '<td style="opacity:.4">–</td>';
        const s = rateStats(g), t = clamp((s.p - base) * 100 / 10, -1, 1), mix = Math.abs(t) * 65;
        return `<td style="background:color-mix(in srgb, var(${t > 0 ? '--c8' : '--c1'}) ${mix.toFixed(0)}%, var(--cellbase));${g.length < 30 ? 'opacity:.55' : ''}" title="${esc(r)} / ${esc(c)}: ${pct(s.p)} of ${s.n}">${(s.p * 100).toFixed(1)}%<small>n=${nf0.format(s.n)}</small></td>`;
      }).join('')}</tr>`).join('')}</tbody></table>`;
  }
  function render() {
    if (!built) { build(); built = true; }
    const rows = filterChurn(), st = rateStats(rows), base = st.p;
    const active = CH_SLICERS.filter(k => S.churn.sel[k].size).length + (S.churn.tenure[0] > 1 || S.churn.tenure[1] < 72 ? 1 : 0) + (S.churn.monthly[0] > 20 || S.churn.monthly[1] < 120 ? 1 : 0);
    $('.sel-n', pane).innerHTML = `<b>${nf0.format(rows.length)}</b> of ${nf0.format(CH.length)} customers`;
    $('.tcount', pane).textContent = active ? `(${active} active)` : '';
    const ch = rows.filter(r => r.churn), rt = rows.filter(r => !r.churn);
    const mrr = sum(ch, r => r.monthly), mrrAll = sum(rows, r => r.monthly);
    $('#ch-kpis').innerHTML = [
      kpi('Customers', nf0.format(st.n), pct(st.n / CH.length, 0) + ' of all customers'),
      kpi('Churn rate', st.n ? pct(st.p) : '–', st.n ? pts(st.p - CH_ALL.p) + ' vs all customers' : '', Math.abs(st.p - CH_ALL.p) < 0.005 ? '' : st.p > CH_ALL.p ? 'up' : 'dn'),
      kpi('Churned customers', nf0.format(st.k), ch.length ? 'avg bill ' + usd2(mean(ch, r => r.monthly)) + ' per month' : ''),
      kpi('Monthly revenue at risk', usdk(mrr), mrrAll ? pct(mrr / mrrAll, 0) + ' of this selection\'s billing' : ''),
      kpi('Avg tenure (churned)', ch.length ? mean(ch, r => r.tenure).toFixed(1) + ' mo' : '–', rt.length ? 'retained: ' + mean(rt, r => r.tenure).toFixed(1) + ' mo' : '')
    ].join('');
    $('#ch-insight').innerHTML = insight(rows, base);
    // segment bars
    const dim = S.churn.dim, seg = segData(rows, dim);
    $('#ch-seg-box').style.height = Math.max(210, seg.length * 34 + 70) + 'px';
    draw('ch-seg', {
      type: 'bar',
      data: { labels: seg.map(g => `${g.key} (n=${nf0.format(g.n)})`), datasets: [{ data: seg.map(g => g.p * 100), backgroundColor: css('--c1'), borderRadius: 3, maxBarThickness: 22 }] },
      options: {
        indexAxis: 'y', layout: { padding: { right: 44 } },
        plugins: {
          legend: { display: false }, valuelabels: { horizontal: true, fmt: v => v.toFixed(1) + '%' }, refline: { lines: [{ axis: 'x', value: base * 100, label: 'Selection ' + pct(base) }] },
          tooltip: { callbacks: { label: c => { const g = seg[c.dataIndex]; return [`Churn rate: ${pct(g.p)} (95% CI ${pct(g.lo)}–${pct(g.hi)})`, `${nf0.format(g.ch)} churned of ${nf0.format(g.n)}`]; } } }
        },
        scales: { x: { min: 0, max: 100, ticks: { callback: v => v + '%' } }, y: { grid: { display: false } } }
      }
    });
    // tenure line with CI band
    const tg = segData(rows, 'tband');
    draw('ch-ten', {
      type: 'line',
      data: {
        labels: tg.map(g => g.key), datasets: [
          { data: tg.map(g => g.hi * 100), borderWidth: 0, pointRadius: 0, fill: '+1', backgroundColor: hexA(css('--c1'), .16) },
          { data: tg.map(g => g.lo * 100), borderWidth: 0, pointRadius: 0, fill: false },
          { data: tg.map(g => g.p * 100), borderColor: css('--c1'), backgroundColor: css('--c1'), borderWidth: 2, pointRadius: 4, pointBorderColor: css('--surface'), pointBorderWidth: 2, tension: 0 }
        ]
      },
      options: {
        plugins: {
          legend: { display: false }, refline: { lines: [{ axis: 'y', value: base * 100 }] },
          tooltip: { filter: i => i.datasetIndex === 2, callbacks: { title: i => 'Tenure ' + i[0].label + ' months', label: c => { const g = tg[c.dataIndex]; return [`Churn rate: ${pct(g.p)} (95% CI ${pct(g.lo)}–${pct(g.hi)})`, `n=${nf0.format(g.n)}`]; } } }
        },
        scales: { y: { suggestedMin: 30, suggestedMax: 70, ticks: { callback: v => v + '%' } }, x: { grid: { display: false }, title: { display: true, text: 'Tenure (months)', color: css('--ink3') } } }
      }
    });
    rateColumns('ch-chg', segData(rows, 'cband'), base, css('--c1'));
    rateColumns('ch-svc', segData(rows, 'nsvc'), base, css('--c1'));
    heat(rows, base);
    tbl.render(true);
  }
  function sync() { if (built) buildSlicers(); }
  return { render, sync };
})();

/* ================= MODEL LAB ================= */
V.models = (() => {
  let built = false, pane, topTbl;
  const M = D.model, MN = Object.keys(M.cv);
  const MCOL = { 'Logistic Regression': '--c1', 'Random Forest': '--c2', 'XGBoost': '--c3', 'SVM': '--c4' };
  const col = n => css(MCOL[n]);
  const pretty = n => n.replace(/_/g, ': ').replace(/([a-z])([A-Z])/g, '$1 $2');
  function conf(name, t) {
    const p = M.probs[name]; let tp = 0, fp = 0, tn = 0, fn = 0;
    for (let i = 0; i < p.length; i++) { const pr = p[i] >= t ? 1 : 0, y = M.y[i]; if (pr && y) tp++; else if (pr && !y) fp++; else if (!pr && !y) tn++; else fn++; }
    const prec = tp + fp ? tp / (tp + fp) : 0, rec = tp + fn ? tp / (tp + fn) : 0;
    return { tp, fp, tn, fn, prec, rec, f1: prec + rec ? 2 * prec * rec / (prec + rec) : 0, acc: (tp + tn) / p.length, fpr: fp + tn ? fp / (fp + tn) : 0 };
  }
  function build() {
    pane = $('#pane-models');
    pane.innerHTML = `<div class="main">
      <div class="callout" id="md-note"></div>
      <div class="bar">
        <div class="fgroup"><div class="flabel"><label for="md-model">Model</label></div><select id="md-model">${MN.map(n => `<option${n === S.models.model ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="fgroup" style="flex:1;min-width:240px"><div class="flabel"><label for="md-t">Decision threshold</label></div>
          <input type="range" id="md-t" min="0.05" max="0.95" step="0.01" value="${S.models.t}" style="width:100%;accent-color:var(--c1);margin:0"><div class="rngval" id="md-tv"></div></div>
        <div style="font-size:12.5px;color:var(--ink2);flex:1 1 280px;max-width:420px">A customer is flagged as likely to churn when the model's score is at or above the threshold. Lower it to catch more churners and accept more false alarms.</div>
      </div>
      <div class="kpis" id="md-kpis"></div>
      <div class="grid g2">
        ${card('ROC curves on the hold-out set', `${nf0.format(M.n_test)} customers the models never saw. The diagonal is a coin flip. Click a legend item to hide a curve.`, '<div class="cbox" style="height:440px"><canvas id="md-roc"></canvas></div>')}
        ${card('Confusion matrix', 'Hold-out customers sorted by the selected model at the chosen threshold', '<div id="md-conf" class="conf"></div><p class="note" id="md-confnote"></p><div class="cbox short" style="margin-top:12px"><canvas id="md-hist"></canvas></div>')}
      </div>
      <div class="grid g2">
        ${card('Cross-validation results', '5-fold stratified CV on the training set, SMOTE applied inside each fold. Dashed line marks 0.50.', '<div class="cbox"><canvas id="md-cv"></canvas></div>')}
        ${card('Metric table', 'Same numbers as the chart, plus hold-out AUC', '<div class="tw"><div id="md-cvt"></div></div>')}
      </div>
      <div class="grid g2">
        ${card('Top feature importances', 'Importance is how much a feature was used by the model, not proof that it predicts churn.', '<div class="cbox tall"><canvas id="md-imp"></canvas></div>', selectBox('md-impm', 'Model', [['XGBoost', 'XGBoost'], ['Random Forest', 'Random Forest']], S.models.imp))}
        ${card('Highest-risk customers in the hold-out set', 'Ranked by the selected model\'s score, with the real outcome alongside', '<div id="md-top"></div>')}
      </div></div>`;
    $('#md-model').addEventListener('change', e => { S.models.model = e.target.value; render(); });
    $('#md-t').addEventListener('input', e => { S.models.t = +e.target.value; render(); });
    $('#md-impm').addEventListener('change', e => { S.models.imp = e.target.value; render(); });
    topTbl = mkTable($('#md-top'), {
      scroll: true,
      getRows: () => {
        const p = M.probs[S.models.model];
        return p.map((s, i) => ({ s, i })).sort((a, b) => b.s - a.s).slice(0, 10).map(({ s, i }) => ({ ...CH[M.idx[i]], score: s, actual: M.y[i] }));
      },
      cols: [{ k: 'id', label: 'Customer' }, { k: 'Contract', label: 'Contract' }, { k: 'tenure', label: 'Tenure', num: true }, { k: 'monthly', label: 'Monthly', num: true, f: r => usd2(r.monthly) },
        { k: 'score', label: 'Risk score', num: true, f: r => r.score.toFixed(2) },
        { k: 'actual', label: 'Actual', f: r => `<span class="pill ${r.actual ? 'bad' : 'good'}">${r.actual ? '✕ Churned' : '✓ Stayed'}</span>` }]
    });
  }
  function render() {
    if (!built) { build(); built = true; }
    const name = S.models.model, t = S.models.t, c = conf(name, t), tm = M.test[name];
    const auc = Object.values(M.test).map(m => m.auc);
    $('#md-note').innerHTML = `<span class="tag">Read this first</span>Hold-out ROC-AUC is <b>${Math.min(...auc).toFixed(2)}–${Math.max(...auc).toFixed(2)}</b> for all four models, which is what a coin flip scores (0.50). Churn is also close to ${pct(CH_ALL.p, 0)} in every customer segment. The fields in this dataset carry almost no signal about who churns, so use this tab to see how the pipeline works rather than as a usable predictor.`;
    $('#md-tv').textContent = 'Flag customers scoring ≥ ' + t.toFixed(2);
    $('#md-kpis').innerHTML = [
      kpi('ROC-AUC (hold-out)', tm.auc.toFixed(3), 'coin flip = 0.500'),
      kpi('Precision', pct(c.prec), 'flagged who really churn'),
      kpi('Recall', pct(c.rec), 'churners that were flagged'),
      kpi('F1 score', c.f1.toFixed(3), 'at threshold ' + t.toFixed(2)),
      kpi('Accuracy', pct(c.acc), 'best constant guess: ' + (() => { const s = M.y.reduce((a, b) => a + b, 0) / M.y.length; return pct(Math.max(s, 1 - s), 0); })())
    ].join('');
    // ROC
    const ds = MN.map(n => ({ label: `${n} (AUC ${M.test[n].auc.toFixed(2)})`, data: M.roc[n].map(([x, y]) => ({ x, y })), showLine: true, borderColor: col(n), backgroundColor: col(n), borderWidth: n === name ? 3 : 1.5, pointRadius: 0, tension: 0 }));
    ds.push({ label: 'Coin flip', data: [{ x: 0, y: 0 }, { x: 1, y: 1 }], showLine: true, borderColor: css('--ink3'), borderDash: [5, 4], borderWidth: 1.25, pointRadius: 0 });
    ds.push({ label: 'Current threshold', data: [{ x: c.fpr, y: c.rec }], pointRadius: 7, pointBackgroundColor: col(name), pointBorderColor: css('--surface'), pointBorderWidth: 2, showLine: false });
    draw('md-roc', {
      type: 'scatter', data: { datasets: ds },
      options: {
        plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: i => `${i.dataset.label.replace(/ \(AUC.*/, '')}: FPR ${i.parsed.x.toFixed(2)}, TPR ${i.parsed.y.toFixed(2)}` } } },
        scales: { x: { min: 0, max: 1, title: { display: true, text: 'False positive rate', color: css('--ink3') } }, y: { min: 0, max: 1, title: { display: true, text: 'True positive rate', color: css('--ink3') } } }
      }
    });
    // confusion
    const tot = M.y.length, cell = (n, good) => `<div class="cell" style="background:color-mix(in srgb, var(${good ? '--c1' : '--c2'}) 24%, var(--surface2))"><b>${nf0.format(n)}</b><small>${pct(n / tot)}</small></div>`;
    $('#md-conf').innerHTML = `<div class="h"></div><div class="h">Predicted: stays</div><div class="h">Predicted: churns</div>
      <div class="h">Actually stayed</div>${cell(c.tn, true)}${cell(c.fp, false)}<div class="h">Actually churned</div>${cell(c.fn, false)}${cell(c.tp, true)}`;
    $('#md-confnote').textContent = `${name} at ${t.toFixed(2)}: ${nf0.format(c.tp + c.fp)} customers flagged, ${nf0.format(c.tp)} of them truly churned.`;
    // histogram
    const bins = 20, h0 = Array(bins).fill(0), h1 = Array(bins).fill(0);
    M.probs[name].forEach((p, i) => { const b = Math.min(bins - 1, Math.floor(p * bins)); (M.y[i] ? h1 : h0)[b]++; });
    draw('md-hist', {
      type: 'bar',
      data: { labels: h0.map((_, i) => (i / bins).toFixed(2)), datasets: [{ label: 'Stayed', data: h0, backgroundColor: css('--c1') }, { label: 'Churned', data: h1, backgroundColor: css('--c2') }] },
      options: {
        plugins: { legend: { position: 'bottom' }, refline: { lines: [{ axis: 'x', value: t * bins - 0.5, label: 'Threshold ' + t.toFixed(2) }] }, tooltip: { callbacks: { title: i => 'Score ' + i[0].label + '–' + (+i[0].label + 1 / bins).toFixed(2) } } },
        scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 7 }, title: { display: true, text: 'Model score', color: css('--ink3') } }, y: { title: { display: true, text: 'Customers', color: css('--ink3') } } }
      }
    });
    // CV chart + table
    const mets = ['ROC-AUC', 'F1-Score', 'Recall', 'Precision'];
    draw('md-cv', {
      type: 'bar',
      data: { labels: mets, datasets: MN.map(n => ({ label: n, data: mets.map(m => M.cv[n][m]), backgroundColor: col(n), borderRadius: 2 })) },
      options: { plugins: { legend: { position: 'bottom' }, refline: { lines: [{ axis: 'y', value: 0.5, label: '0.50' }] }, tooltip: { callbacks: { label: i => `${i.dataset.label}: ${i.parsed.y.toFixed(3)}` } } }, scales: { y: { min: 0, max: 1 }, x: { grid: { display: false } } } }
    });
    $('#md-cvt').innerHTML = `<table class="tbl"><thead><tr><th>Model</th>${mets.map(m => `<th class="num">${m}</th>`).join('')}<th class="num">Hold-out AUC</th></tr></thead><tbody>${MN.map(n =>
      `<tr><td><span class="sw" style="background:${col(n)}"></span>${n}</td>${mets.map(m => `<td class="num">${M.cv[n][m].toFixed(3)}</td>`).join('')}<td class="num">${M.test[n].auc.toFixed(3)}</td></tr>`).join('')}</tbody></table>`;
    // importances
    const imp = M.imp[S.models.imp].slice(0, 12);
    draw('md-imp', {
      type: 'bar', data: { labels: imp.map(x => pretty(x[0])), datasets: [{ data: imp.map(x => x[1]), backgroundColor: col(S.models.imp), borderRadius: 3 }] },
      options: { indexAxis: 'y', layout: { padding: { right: 40 } }, plugins: { legend: { display: false }, valuelabels: { horizontal: true, fmt: v => v.toFixed(3) }, tooltip: { callbacks: { label: i => 'Importance ' + i.parsed.x.toFixed(4) } } }, scales: { x: { min: 0 }, y: { grid: { display: false } } } }
    });
    topTbl.render();
  }
  return { render };
})();

  function build() {
    pane = $('#pane-impact');
    pane.innerHTML = `<div class="layout">${sideShell('Scenario inputs')}<section class="main">
      <div class="callout" id="im-verdict"></div>
      <div class="kpis" id="im-kpis"></div>
      <div class="grid g2">
        ${card('Net value of the retention program', 'Revenue kept minus retention spend, for each level of churn reduction. The dot is your current setting.', '<div class="cbox"><canvas id="im-sens"></canvas></div>')}
        ${card('Cost to win a customer, by channel', 'Marketing spend ÷ conversions, using the ad region and dates filtered on the Marketing tab', '<div class="cbox" id="im-cpa-box"><canvas id="im-cpa"></canvas></div>')}
      </div>
      <div class="grid g2">
        ${card('Monthly revenue lost to churn, by contract', 'Billing of churned customers in the selection', '<div class="cbox short"><canvas id="im-risk"></canvas></div>')}
        ${card('How this is calculated', '', `<ul class="find">
          <li><b>Customers saved</b> = customers in scope × churn reduction, capped at the number that churned.</li>
          <li><b>Revenue kept</b> = customers saved × their average monthly charge × horizon.</li>
          <li><b>Replacement cost</b> uses the marketing files' spend per conversion as the price of winning a new customer.</li>
          <li>The churn and marketing files share no customer or date key, so this is a what-if on two separate datasets. Treat one marketing conversion as one new customer. It also ignores the lower revenue of brand-new customers and any discounts.</li></ul>`)}
      </div></section></div>`;
    wireSide(pane); buildSlicers();
    $('.reset', pane).addEventListener('click', () => { S.churn.sel.Contract.clear(); S.churn.sel.InternetService.clear(); S.mkt.sel.Channel.clear(); S.mkt.sel.Region.clear(); S.impact.pts = 5; S.impact.cost = 25; S.impact.horizon = 12; buildSlicers(); render(); });
  }
  function render() {
    if (!built) { build(); built = true; }
    const rows = filterChurn(), st = rateStats(rows), ch = rows.filter(r => r.churn);
    const avgM = ch.length ? mean(ch, r => r.monthly) : mean(rows, r => r.monthly);
    const mk = filterMkt(), cpa = mkAgg(mk).cpa, I = S.impact;
    const saved = p => Math.min(st.k, st.n * p / 100), net = p => saved(p) * (avgM * I.horizon - I.cost);
    const sv = saved(I.pts), kept = sv * avgM * I.horizon, spend = sv * I.cost, repl = sv * cpa;
    $('.sel-n', pane).innerHTML = `<b>${nf0.format(st.n)}</b> customers · <b>${mk.length}</b> campaigns`;
    $('.tcount', pane).textContent = '';
    $('#im-kpis').innerHTML = [
      kpi('Customers in scope', nf0.format(st.n), pct(st.p) + ' churn · ' + nf0.format(st.k) + ' churned'),
      kpi('Customers saved', nf0.format(Math.round(sv)), I.pts.toFixed(1) + ' pts fewer churners'),
      kpi('Revenue kept', usdk(kept), 'over ' + I.horizon + ' months at ' + usd2(avgM) + '/mo'),
      kpi('Retention spend', usdk(spend), usd(I.cost) + ' per saved customer'),
      kpi('Net value', usdk(kept - spend), kept - spend >= 0 ? 'program pays for itself' : 'program loses money', kept - spend >= 0 ? 'dn' : 'up'),
      kpi('Cost to win a customer', mk.length ? usd2(cpa) : '–', 'marketing spend per conversion')
    ].join('');
    $('#im-verdict').innerHTML = !mk.length || !st.n ? '<span class="tag">No data</span>Widen the filters to get a result.'
      : `<span class="tag">Verdict</span>Keeping a customer at <b>${usd2(I.cost)}</b> costs ${I.cost < cpa ? '<b>less</b>' : '<b>more</b>'} than the <b>${usd2(cpa)}</b> marketing spends to win one. A saved customer keeps about <b>${usd(avgM * I.horizon)}</b> of revenue over ${I.horizon} months, so the program nets <b>${usd(kept - spend)}</b>. Replacing the same ${nf0.format(Math.round(sv))} customers through marketing would cost <b>${usd(repl)}</b>.`;
    // sensitivity
    const xs = Array.from({ length: 21 }, (_, i) => i);
    draw('im-sens', {
      type: 'line',
      data: { labels: xs.map(x => x + ' pts'), datasets: [{ label: 'Net value', data: xs.map(net), borderColor: css('--c1'), backgroundColor: css('--c1'), borderWidth: 2, pointRadius: 0, tension: 0 }, { label: 'Current setting', data: xs.map(x => x === Math.round(I.pts) ? net(I.pts) : null), pointRadius: 7, pointBackgroundColor: css('--c2'), pointBorderColor: css('--surface'), pointBorderWidth: 2, showLine: false }] },
      options: { plugins: { legend: { display: false }, refline: { lines: [{ axis: 'y', value: 0, label: 'Break-even' }] }, tooltip: { callbacks: { label: c => c.datasetIndex ? 'Current: ' + usd(c.parsed.y) : 'Net value: ' + usd(c.parsed.y) } } }, scales: { y: { ticks: { callback: v => usdk(v) } }, x: { grid: { display: false }, ticks: { maxTicksLimit: 8 }, title: { display: true, text: 'Churn reduction', color: css('--ink3') } } } }
    });
    // CPA by channel (ignores the channel filter so every channel shows)
    const cpaRows = MK.filter(r => (!S.mkt.sel.Region.size || S.mkt.sel.Region.has(r.Region)) && r.mi >= S.mkt.range[0] && r.mi <= S.mkt.range[1]);
    const cg = [...groupBy(cpaRows, r => r.Channel)].map(([k, v]) => ({ k, cpa: mkAgg(v).cpa, n: v.length })).sort((a, b) => a.cpa - b.cpa);
    $('#im-cpa-box').style.height = Math.max(210, cg.length * 40 + 70) + 'px';
    draw('im-cpa', {
      type: 'bar', data: { labels: cg.map(x => `${x.k} (${x.n})`), datasets: [{ data: cg.map(x => x.cpa), backgroundColor: css('--c1'), borderRadius: 3, maxBarThickness: 26 }] },
      options: { indexAxis: 'y', layout: { padding: { right: 50 } }, plugins: { legend: { display: false }, valuelabels: { horizontal: true, fmt: usd2 }, refline: { lines: I.cost > 0 ? [{ axis: 'x', value: I.cost, label: 'Retention ' + usd(I.cost) }] : [] }, tooltip: { callbacks: { label: c => 'Cost per conversion ' + usd2(c.parsed.x) } } }, scales: { x: { min: 0, ticks: { callback: v => '$' + v } }, y: { grid: { display: false } } } }
    });
    // revenue at risk by contract
    const cr = [...groupBy(ch, r => r.Contract)].map(([k, v]) => ({ k, mrr: sum(v, r => r.monthly), n: v.length })).sort((a, b) => b.mrr - a.mrr);
    draw('im-risk', {
      type: 'bar', data: { labels: cr.map(x => `${x.k} (${nf0.format(x.n)})`), datasets: [{ data: cr.map(x => x.mrr), backgroundColor: css('--c2'), borderRadius: 3, maxBarThickness: 26 }] },
      options: { indexAxis: 'y', layout: { padding: { right: 54 } }, plugins: { legend: { display: false }, valuelabels: { horizontal: true, fmt: usdk }, tooltip: { callbacks: { label: c => usd(c.parsed.x) + ' per month' } } }, scales: { x: { min: 0, ticks: { callback: v => usdk(v) } }, y: { grid: { display: false } } } }
    });
  }
  function sync() { if (built) buildSlicers(); }
  return { render, sync };
})();

/* ================= glue ================= */
const TABS = [['overview', 'Overview'], ['churn', 'Churn Explorer'], ['models', 'Model Lab'], ['marketing', 'Marketing'], ['sales', 'Sales Trend'], ['impact', 'Retention vs. Acquisition']];
let current = null;
function show(id, fromHash) {
  if (!V[id]) id = 'overview';
  current = id;
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === id)));
  $$('.pane').forEach(p => { p.hidden = p.id !== 'pane-' + id; });
  if (V[id].sync) V[id].sync();
  V[id].render();
  if (!fromHash && location.hash !== '#' + id) { try { history.replaceState(null, '', '#' + id); } catch (e) { /* hash routing is optional */ } }
}
function boot() {
  chartDefaults();
  const nav = $('nav.tabs'); nav.innerHTML = TABS.map(([id, t]) => `<button type="button" role="tab" data-t="${id}" aria-selected="false">${t}</button>`).join('');
  $$('button', nav).forEach(b => b.addEventListener('click', () => show(b.dataset.t)));
  window.addEventListener('hashchange', () => show(location.hash.slice(1), true));
  const rerender = () => { chartDefaults(); if (current) V[current].render(); };
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  const mq = window.matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener('change', rerender) : mq.addListener(rerender));
  show(location.hash.slice(1) || 'overview', true);
}
boot();

</script>
